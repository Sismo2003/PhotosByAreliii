# Serves the built client portal under /client/ (Vite base) and the shared sign-in page at /login.
# Single-page app: unknown paths fall back to index.html so React Router handles them.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same headers on every HTML response (portal and /login).
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

  location = /client {
    return 301 /client/;
  }

  # Hashed build files never change: cache for a year.
  location /client/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /login {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /client/index.html =404;
  }

  location /client/ {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /client/index.html;
  }
}
