# Edge nginx: the only container with ports 80/443 open on the Hetzner server.
#   photosbyareliii.com/          → web   (public Astro site)
#   photosbyareliii.com/admin/    → admin (studio admin, this repo's admin/)
#   photosbyareliii.com/client/   → client (client portal, this repo's client/)
#   photosbyareliii.com/login     → client (the ONE sign-in page for admins and clients; after
#                                   signing in, the role the API returns picks /admin/ or /client/)
#   photosbyareliii.com/api/      → api   (Express backend)
#   admin.photosbyareliii.com/*   → 301 to photosbyareliii.com/admin/*
# One origin for site, admin and API, so the httpOnly login cookie works without CORS.
# TLS certificates: certbot (webroot) writes to /etc/letsencrypt, mounted read-only.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# HTTP → HTTPS (and the ACME challenge for certbot)
server {
  listen 80;
  server_name photosbyareliii.com www.photosbyareliii.com admin.photosbyareliii.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://photosbyareliii.com$request_uri;
  }
}

# admin.photosbyareliii.com → photosbyareliii.com/admin/
server {
  listen 443 ssl;
  http2 on;
  server_name admin.photosbyareliii.com;

  ssl_certificate     /etc/letsencrypt/live/photosbyareliii.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/photosbyareliii.com/privkey.pem;

  return 301 https://photosbyareliii.com/admin$request_uri;
}

# www → apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.photosbyareliii.com;

  ssl_certificate     /etc/letsencrypt/live/photosbyareliii.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/photosbyareliii.com/privkey.pem;

  return 301 https://photosbyareliii.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name photosbyareliii.com;

  ssl_certificate     /etc/letsencrypt/live/photosbyareliii.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/photosbyareliii.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API. Photo uploads are one photo per request, max 50 MB each
  # (docs/almacenamiento-fotos.md §5.3); downloads stream, so no buffering.
  location /api/ {
    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api:4000;
  }

  # Shared sign-in page (client/ app). The old per-app sign-in URLs land on it, keeping ?redirect=…
  location = /login {
    client_max_body_size 1m;
    proxy_pass http://client:80;
  }
  location = /admin/login {
    return 302 /login$is_args$args;
  }
  location = /client/login {
    return 302 /login$is_args$args;
  }

  # Client portal
  location = /client {
    return 301 /client/;
  }
  location /client/ {
    client_max_body_size 1m;
    proxy_pass http://client:80;
  }

  # Studio admin
  location = /admin {
    return 301 /admin/;
  }
  location /admin/ {
    client_max_body_size 1m;
    proxy_pass http://admin:80;
  }

  # Public site
  location / {
    client_max_body_size 1m;
    proxy_pass http://web:80;
  }
}
