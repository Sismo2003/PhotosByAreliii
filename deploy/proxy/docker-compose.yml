# OPTIONAL — only for a server that does NOT already run the shared nginx-proxy (a fresh VPS, a new
# home server). On `grid` it already exists (/root/nginx): do not start this there, it would fight
# for ports 80/443 and take every other project down.
#
#   docker network create nginx
#   cd deploy/proxy && docker compose up -d
#
# Each project then drops its vhost in ./conf.d (rollout.sh does it when NGINX_CONF_DIR points here).
name: nginx-proxy

services:
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [nginx]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  nginx:
    name: nginx
    external: true
