# Serves the built public site at the root. /admin/, /client/, /login and /api/ never reach this
# container: the edge nginx (deploy/nginx) routes them to their own services.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Astro's own 404 page (English); /es/… misses land on it too.
  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets (JS, CSS, optimized photos): cache forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Every script is a file from this origin (Astro emits no inline JS here: vite assetsInlineLimit 0,
    # no UI framework islands; public/lang.js is a classic file). JSON-LD/JSON data blocks don't execute.
    # Inline styles stay allowed: a few elements set object-position / flex from data.
    # connect-src 'self': the header asks /api/auth/me (same origin) who is signed in, and /book calls /api/public/*.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
