# Serves the built admin under /admin/ (Vite base). Single-page app: unknown paths fall back
# to index.html so React Router handles /admin/bookings, /admin/settings/email, etc.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /admin {
    return 301 /admin/;
  }

  # Hashed build files never change: cache for a year.
  location /admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /admin/ {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /admin/index.html;
  }
}
